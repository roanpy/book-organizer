name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Run Python tests
        run: PYTHONPATH=src python -m pytest

      - name: Run Ruff
        run: PYTHONPATH=src ruff check src tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend syntax
        run: |
          node --check static/i18n.js
          node --check static/app.js
          node --check static/js/modules/api.js
          node --check static/js/modules/ui.js
          node --check static/js/modules/state.js
          node --check static/js/modules/sync.js
          node --check static/js/modules/settings/cloud-sync.js
          node --check static/js/modules/libraryBatch/process.js

      - name: Check public source safety
        run: python scripts/check_public_safety.py
