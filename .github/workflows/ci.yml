name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Run Python tests
        run: PYTHONPATH=src python -m pytest

      - name: Run Ruff
        run: PYTHONPATH=src ruff check src tests

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check frontend syntax
        run: |
          node --check static/i18n.js
          node --check static/app.js
          node --check static/js/modules/api.js
          node --check static/js/modules/ui.js
          node --check static/js/modules/state.js
          node --check static/js/modules/sync.js
          node --check static/js/modules/settings/cloud-sync.js
          node --check static/js/modules/libraryBatch/process.js

      - name: Check public source safety
        run: python scripts/check_public_safety.py
