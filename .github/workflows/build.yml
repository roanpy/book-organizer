name: Build macOS

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'  # 仅在创建版本标签时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-build.txt

      - name: Build macOS App
        run: ./scripts/build_standalone.sh

      # Distribution stays disabled until the maintainer confirms the AGPL or
      # commercial-license policy for bundled EbookLib and PyMuPDF components.
