[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-organizer"
version = "0.8.3"
description = "A sophisticated local book organization system with hybrid AI intelligence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "roanpy" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Runtime dependency metadata only. requirements.txt is the locked source
    # used by local development and packaging.
    "beautifulsoup4",
    "ddgs>=9.14.4",
    "EbookLib",
    "fastapi>=0.100.0",
    "google-api-python-client",
    "google-auth>=2.15.0,<2.42.0",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "google-generativeai",
    "litellm",
    "loguru",
    "lxml",
    "ollama",
    "openai",
    "pydantic>=2.0.0",
    "pikepdf>=9.0.0",
    "PyMuPDF>=1.26.0",
    "pypdf>=6.0.0",
    "pywebview",
    "python-multipart",
    "requests",
    "tiktoken",
    "uvicorn>=0.20.0",
]

[project.scripts]
book-organizer = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/book_organizer"]

[tool.ruff]
# Ruff 配置 - 替代 Flake8/Black/Isort
line-length = 88
target-version = "py311"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "scripts/archived",
    "venv",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
